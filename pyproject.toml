[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ox4c"
version = "1.0.0"
description = "Reference implementation and experimental artifact for the OX4C cybersecurity architecture"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
authors = [
  {name = "Vagner E. Quincozes", email = "vequincozes@midiacom.uff.br"},
]
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.1,<3",
  "scikit-learn>=1.4,<2",
  "scipy>=1.11,<2",
  "matplotlib>=3.8,<4",
  "joblib>=1.3,<2",
  "psutil>=7.2,<8",
  "shap>=0.46,<1",
  "agraspqfs>=1.0.1,<2",
]

[tool.setuptools.packages.find]
where = ["src"]
